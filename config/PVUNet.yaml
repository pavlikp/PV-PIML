architecture: "PVUNet"
# Parameters for training model
train_params:
  device: cuda:0
  train_batch_size: 16
  valid_batch_size: 128
  test_batch_size: 16
  max_epochs: 9999
  # Max time used for training (days:hours:mins:secs)
  max_time: "99:00:00:00"
  # Validate after every n epochs
  val_check_interval: 1.0
  num_workers: 4
  gpus: 1
  savefile: "PV-PIML"
  val_batches: 9999999
  train_batches: 512
  early_stopping:
    strict: false
    verbose: true
    monitor: "val_loss"
    min_delta: 0.00001
    patience: 8
  lr_scheduler:
    name: "ExponentialLR"
    kwargs:
      gamma : 0.95
  lr: 1e-02
  loss: "mse"
model_params:
  kernel_size: 3
  out_channels: 1
  conv_shape:
      [
        ["1", [1, 2]],
        ["2", [2, 4]],
        ["3", [4, 8]],
        ["4", [8, 16]],
        ["5", [16, 32]],
        ["6", [48, 16]],
        ["7", [24, 8]],
        ["8", [12, 4]],
        ["9", [6, 2]]
      ]

dataset:
  path: 'C:\Users\peter\Repos\ENFIELD-data\processed_unpack\nwp_0h'
  previous_days: 0
  target_variables: ['ghi']